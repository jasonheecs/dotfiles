# --- General behavior ---------------------------------------------------

# Enable mouse support: click to switch panes, drag to resize, scroll to
# scroll back through history.
set -g mouse on

# Start window and pane numbering at 1 instead of 0 (easier to reach on
# keyboard, and matches most keyboard layouts' number row order).
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed, so you don't end up
# with gaps like 1, 3, 4.
set -g renumber-windows on

# Bump the scrollback buffer size (default is only 2000 lines).
set -g history-limit 10000

# Faster escape-key response time (helps if you use vim/neovim inside tmux).
set -sg escape-time 10

# --- Status bar / prefix indicator ---------------------------------------

# Show "PREFIX" in the status bar while tmux is waiting for your next
# keystroke after Ctrl+b, so you always know if it registered.
set -g status-right '#{?client_prefix,#[fg=black]#[bg=yellow] PREFIX #[default] ,}%H:%M | %d-%b-%y'

# Refresh the status bar quickly so the prefix indicator feels responsive.
set -g status-interval 1

# --- Pane splitting ---------------------------------------------------

# Split panes using | and - (more intuitive than % and "), and open new
# panes in the same working directory as the current one.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Also open new windows in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation ---------------------------------------------------

# Move between panes with Alt+arrow keys, no prefix needed.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Pane borders -------------------------------------------------------

# Make the active pane's border easier to spot at a glance.
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# --- Reload config quickly ------------------------------------------------

# Press prefix + r to reload this file without restarting tmux.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"