name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: tests/.cache
          key: zdot-${{ hashFiles('.zimrc') }}

      - name: Install test tooling
        run: brew bundle --file=tests/Brewfile

      - name: Run test suite
        run: bats tests/

      - name: Install on a fresh machine and start a shell
        run: |
          tests/install.sh
          zsh -i -c 'true'

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          version: v0.11.0
          additional_files: "bats osx"
          ignore_names: ".zshrc"

      - name: Lint git alias bodies
        run: tests/lint-gitaliases.sh

  editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
        with:
          version: v4.0.1

      - run: editorconfig-checker

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: raven-actions/actionlint@v2
        with:
          version: "1.7.12"
