name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: tests/.cache
          key: zdot-${{ hashFiles('.zimrc') }}

      - name: Install test tooling
        run: brew bundle --file=tests/Brewfile

      - name: Run test suite
        run: bats tests/
